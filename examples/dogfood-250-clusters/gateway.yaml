apiVersion: ax.io/v1alpha1
kind: Gateway
metadata:
  name: kube-agents-cluster-gw
  atespace: default
spec:
  kubernetes:
    clusters:
      - in-cluster
    defaultCluster: in-cluster
  egress:
    - http:
        hostnames:
          - inference-gateway.kubeagents-system.svc.cluster.local
          - inference-gateway.kubeagents-system.svc
        ports:
          numbers:
            - 80
